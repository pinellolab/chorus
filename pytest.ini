[pytest]
# The default run excludes `integration`, so that a bare `pytest` means the same
# thing everywhere: for a contributor, for CI, and in the audit checklist.
#
# It did not, and that was a real inconsistency rather than a nitpick. `pytest.ini`
# set no `addopts`, so `pytest tests/` collected the integration tests, which spawn
# oracle subprocesses and download weights from HuggingFace/ENCODE -- red on any
# machine without the per-oracle envs built. CI was green only because it passed
# `-m "not integration"` and additionally `--ignore=tests/test_smoke_predict.py`
# (whose fixtures were unmarked AND unguarded, so they raised instead of skipping).
# "The tests pass" therefore had two different meanings depending on who ran it.
#
# Opt in explicitly; a `-m` on the command line overrides the one below:
#     pytest -m integration              # the integration suite, needs the envs.
#                                        # ~125 tests on a fresh clone; a provisioned host
#                                        # collects more (162 here) because some tests
#                                        # parametrize over locally-present artefacts --
#                                        # genomes, backgrounds, per-oracle envs. So the
#                                        # figure is a magnitude, not an identity: what it
#                                        # is good for is noticing a run that selected 0.
#     pytest -m ""                       # everything, no marker filter at all
#
# Release gating needs BOTH runs. Excluding by default is about making the common
# command honest, not about retiring the integration suite -- see
# audits/AUDIT_CHECKLIST.md section 11.
addopts = -m "not integration"

markers =
    integration: slow end-to-end tests that hit the network, download
        models/CDFs from HuggingFace/ENCODE, spawn the chorus-mcp
        subprocess, or drive a headless browser. Excluded by default (see
        addopts); run with `pytest -m integration` when maintainer
        verification is needed.
